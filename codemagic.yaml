workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate platform folders
        script: |
          cd mobile_app
          flutter create --org edu.kwasu --project-name secure_messenger .
          rm -f test/widget_test.dart
      - name: Android config
        script: |
          cd mobile_app
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i.bak 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          cat $MANIFEST
          grep -q "android.permission.INTERNET" $MANIFEST
      - name: Packages and tests
        script: |
          cd mobile_app
          flutter pub get
          flutter test
      - name: Build APK
        script: |
          cd mobile_app
          flutter build apk --release
    artifacts:
      - mobile_app/build/app/outputs/flutter-apk/*.apk
